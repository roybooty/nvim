# Set prefix to Ctrl-Space
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1          # Start windows at 1
setw -g pane-base-index 1    # Start panes at 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on # Gapless sequences (if you close window 2, 3 becomes 2)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Status bar colors
set -g status-style bg='#333333',fg='#cccccc'

# Left side (Session name)
set -g status-left "#[fg=#ffffff,bg=#444444,bold] #S #[default] "

# Right side (Date/Time) - minimalist silver
set -g status-right "#[fg=#aaaaaa]%Y-%m-%d #[fg=#ffffff,bold]%H:%M "

# Current window tab (highlighted silver)
set-window-option -g window-status-current-style bg='#555555',fg='#ffffff',bold
set-window-option -g window-status-current-format " #I:#W "

# Inactive window tabs
set-window-option -g window-status-format " #I:#W "
# Pane borders
set -g pane-border-style fg='#444444'
set -g pane-active-border-style fg='#c0c0c0'
